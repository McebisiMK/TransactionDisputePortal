services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dispute_Portal_2026!}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__Default: Server=sqlserver,1433;Database=TransactionDisputePortal;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Dispute_Portal_2026!};TrustServerCertificate=True;MultipleActiveResultSets=True;
      Keycloak__MetadataAddress: http://keycloak:8080/realms/transaction-dispute-portal/.well-known/openid-configuration
      LuckyPennySoftware__LicenseKey: ${LUCKY_PENNY_LICENSE_KEY:-}
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      keycloak:
        condition: service_started

  web:
    build:
      context: ../transaction-dispute-portal-web
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://localhost:5000
      WEB_BASE_URL: http://localhost:3000
      KEYCLOAK_AUTHORITY: http://localhost:8080/realms/transaction-dispute-portal
      KEYCLOAK_CLIENT_ID: dispute-portal-web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  sqlserver-data:
  keycloak-data:
