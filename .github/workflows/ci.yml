name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore TransactionDisputePortal.slnx

      - name: Build
        run: dotnet build TransactionDisputePortal.slnx --configuration Release --no-restore

      - name: Check generated API client is up to date
        run: |
          if ! git diff --exit-code -- TransactionDisputePortal.API.Client/openapi.json TransactionDisputePortal.API.Client/Typescript/api-client.ts; then
            echo "::error::The generated API client is out of date. Build the solution locally and commit openapi.json and Typescript/api-client.ts."
            exit 1
          fi

      - name: Test
        run: >
          dotnet test TransactionDisputePortal.slnx
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build --tag transaction-dispute-portal-api:${{ github.sha }} .
